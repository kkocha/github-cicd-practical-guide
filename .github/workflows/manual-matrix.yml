name: Manual Matrix
on: push
jobs:
  print:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            version: 24
          - os: macos-latest
            version: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.version}}
      - run: echo "${RUNNER_OS}" && node --version